databaseChangeLog:
  - changeSet:
      id: 008_create_table_users
      author: phoksosatsyabrawit@gmail.com
      changes:
        - createTable: 
            tableName: users
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                     primaryKey: true
                  name: user_id
                  type: BIGINT
              - column:
                  name: first_name
                  type: varchar(25)
              - column:
                  name: last_name
                  type: varchar(25)
              - column:
                  name: username
                  type: varchar(25)
              - column:
                  name: password
                  type: varchar(25)
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: role
                  type: varchar(25)
              - column:
                  name: is_account_non_expired
                  type: BOOLEAN
              - column:
                  name: is_account_non_locked
                  type: BOOLEAN
              - column:
                  name: is_credentials_non_expired
                  type: BOOLEAN
              - column:
                  name: is_enabled
                  type: BOOLEAN
           

    

