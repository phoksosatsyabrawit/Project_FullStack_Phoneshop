databaseChangeLog:
  - changeSet:
      id: 012_create_roles_permissions_join_table
      author: phoksosatsyabrawit@gmail.com
      changes:
        - createTable:
            tableName: roles_permissions
            columns:
              - column:
                  name: role_role_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: permissions_permission_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: roles_permissions
            columnNames: role_role_id, permissions_permission_id
            constraintName: pk_roles_permissions
        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: role_role_id
            constraintName: fk_roles_permissions_role
            referencedTableName: roles
            referencedColumnNames: role_id
        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: permissions_permission_id
            constraintName: fk_roles_permissions_permission
            referencedTableName: permissions
            referencedColumnNames: permission_id


           

    

