<div *ngIf="isLoggedIn; then thenBlock; else elseBlock"></div>
<ng-template #thenBlock>
  <div class="wrapper">
    <app-nav-sidebar></app-nav-sidebar>

    <div class="main">
      <app-nav-bar (logoutEvent)="isLoggedOutEmit($event)"></app-nav-bar>

      <main class="content">
        <div class="container-fluid p-0">

          <router-outlet></router-outlet>

        </div>
      </main>

      <app-footer></app-footer>
    </div>
  </div>
</ng-template>
<ng-template #elseBlock>
  <app-login (isLoggedInEvent)="isLoggedInEmit($event)"></app-login>
</ng-template>
