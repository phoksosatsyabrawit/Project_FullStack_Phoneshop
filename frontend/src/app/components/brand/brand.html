<div class="container">
    <div class="card bg-white p-4 shadow rounded" style="width: 100%; max-width: 100%;">
        <form [formGroup]="brandForm">
            <div class="form-group row" style="padding: 9px;">
                <label for="inputBrand3" class="col-sm-2 col-form-label">Brands</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="inputBrand3" formControlName="name">
                </div>
            </div>
            <div class="form-group row" style="padding: 9px;">
                <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary" (click)="submit()">submit</button>
                </div>
            </div>
        </form>
    </div>
</div>
