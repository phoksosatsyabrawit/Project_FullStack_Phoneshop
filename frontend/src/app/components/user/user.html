<div class="container">
    <div class="card bg-white p-4 shadow rounded" style="width: 100%; max-width: 100%;">
        <form [formGroup]="userForm">
            <div class="form-group row" style="padding: 9px;">
                <label for="inputEmail3" class="col-sm-2 col-form-label">Username:</label>
                <div class="col-sm-10">
                    <input type="username" class="form-control" id="inputUsername3" formControlName="username">
                </div>
            </div>
            <div class="form-group row" style="padding: 9px;">
                <label for="inputPassword3" class="col-sm-2 col-form-label">Email:</label>
                <div class="col-sm-10">
                    <input type="email" class="form-control" id="inputEmail3" formControlName="email">
                </div>
            </div>
            <div class="form-group row" style="padding: 9px;">
                <label for="inputPassword3" class="col-sm-2 col-form-label">Password:</label>
                <div class="col-sm-10">
                    <input type="password" class="form-control" id="inputPassword3" formControlName="password">
                </div>
            </div>
            <div class="form-group row" style="padding: 9px;">
                <div class="col-sm-2">Role:</div>
                <div class="col-sm-10">
                    <div class="form-check" formArrayName="roles" *ngFor="let role of roles.controls; let i = index;">
                        <input class="form-check-input" type="checkbox" id="gridCheck1" [formControlName]="i">
                        <label class="form-check-label">
                            {{roleNames[i]}}
                        </label>
                    </div>
                </div>
            </div>
            <div class="form-group row" style="padding: 9px;">
                <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary" (click)="submit()"
                        [disabled]="isSubmited">submit</button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- {{userForm.value | json}} -->
