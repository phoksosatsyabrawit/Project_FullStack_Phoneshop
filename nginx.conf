server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser calls /api/...  ->  nginx forwards to the backend container.
    # "app" is the compose service name (Docker's built-in DNS, network lesson).
    # The trailing "/" after 8080 strips the "/api" prefix:
    #   /api/products  ->  backend receives /products
    # "^~" makes this rule win over the static-file rule below.
    location ^~ /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Angular client-side routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build files can be cached for a long time
    location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users get stuck on old versions
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
}
